<!--
  Percé favicon: a lowercase "p" on the brand ground (#0E0E0E), set in the
  brand grotesque. Deliberately a plain letter — the wordmark is lowercase
  "percé" and the identity carries no icon, monogram badge or symbol. A
  favicon uploaded from Dashboard > Layout Settings overrides this at runtime.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0E0E0E"/>
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="'Inter Tight', Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.5" fill="#F2F0ED">p</text>
</svg>
